name: Supabase Keep-Alive

on:
  schedule:
    # Daily 00:00 UTC, enough to prevent pausing due to 7 days of inactivity.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Query profiles memakai anon key. RLS profiles tidak punya policy
          # untuk role anon, jadi hasilnya selalu [] (HTTP 200) tanpa
          # membocorkan data apa pun — cukup sebagai sinyal aktivitas.
          curl -fsS \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -o /dev/null
          echo "Supabase pinged successfully."