name: Supabase Keep-Alive

on:
  schedule:
    # Daily at 13:17 UTC — odd-minute avoids peak-hour queuing.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Query profiles memakai anon key. RLS profiles tidak punya policy
          # untuk role anon, jadi hasilnya selalu [] (HTTP 200) tanpa
          # membocorkan data apa pun — cukup sebagai sinyal aktivitas.
          # Header Prefer: count=exact memaksa PostgREST menjalankan COUNT(*)
          # paralel → dua query per HTTP call, lebih banyak aktivitas tercatat.
          curl -fsS \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Prefer: count=exact" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -o /dev/null
          echo "Supabase pinged successfully."